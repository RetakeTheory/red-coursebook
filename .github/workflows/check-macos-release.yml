name: Check macOS and Android release
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        default: v1.3.1
        required: true
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify question bank and scoring
        run: npm test
      - name: Cache the universal desktop runtime
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: build/mac-runtime/neutralino-mac_universal
          key: coursebook-mac-universal-${{ hashFiles('prepare_mac_runtime.py', 'prepare_runtime.py') }}
      - name: Build the candidate application
        if: github.event_name == 'push'
        run: |
          npm ci
          python3 prepare_runtime.py
          npm run build
          python3 -m venv "$RUNNER_TEMP/book-venv"
          "$RUNNER_TEMP/book-venv/bin/pip" install Pillow
          "$RUNNER_TEMP/book-venv/bin/python" package_mac.py
          cp build/release/*-macOS*.zip "$RUNNER_TEMP/RedCoursebook-macOS-universal.zip"
      - name: Share the runtime for cross-platform packaging
        if: github.event_name == 'push' && matrix.runner == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: mac-universal-runtime
          path: build/mac-runtime/neutralino-mac_universal
          retention-days: 7
      - name: Download the shipped application
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$RELEASE_TAG" --pattern 'RedCoursebook-macOS-universal.zip' --dir "$RUNNER_TEMP"
      - name: Verify window dragging and saved-frame recovery
        run: python3 tests/macos_smoke.py "$RUNNER_TEMP/RedCoursebook-macOS-universal.zip"
  android:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Android from source
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          npm ci --prefix android
          python3 android/build.py
      - name: Download and verify the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern 'RedCoursebook-Android.apk' --dir "$RUNNER_TEMP"
          python3 tests/android_release.py "$RUNNER_TEMP/RedCoursebook-Android.apk"
