name: Check macOS desktop release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        default: v1.0.0
        required: true
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify question bank and scoring
        run: node --test tests/model.test.mjs
      - name: Download the shipped application
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$RELEASE_TAG" --pattern 'RedCoursebook-macOS-universal.zip' --dir "$RUNNER_TEMP"
      - name: Verify and launch the released app
        run: python3 tests/macos_smoke.py "$RUNNER_TEMP/RedCoursebook-macOS-universal.zip"
